version: "3.8"

services:

  app:
    image: douglagoncalves/central-celular:latest
    restart: always
    networks:
      - inove_public
      - traefik_public
    volumes:
      - central_celular_data:/app/data  # ajuste conforme o volume necessário
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:84476291@db:5432/central_celular
      - VITE_HOST=0.0.0.0
      - HOST=0.0.0.0
      # outras variáveis específicas do app que precisar
    depends_on:
      - db
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        # Configuração para a API (porta 3000)
        - "traefik.http.routers.central-api.rule=Host(`central.manytalks.com.br`)"
        - "traefik.http.routers.central-api.entrypoints=websecure"
        - "traefik.http.routers.central-api.tls=true"
        - "traefik.http.routers.central-api.tls.certresolver=le"
        - "traefik.http.services.central-api.loadbalancer.server.port=3000"
        - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"
        - "traefik.http.middlewares.central-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
        - "traefik.http.routers.central-api.middlewares=central-headers,https-redirect"
        
        # Configuração adicional para o frontend (porta 5173) em um subdomínio ou caminho
        - "traefik.http.routers.central-ui.rule=Host(`central.manytalks.com.br`) && PathPrefix(`/ui`)"
        - "traefik.http.routers.central-ui.entrypoints=websecure"
        - "traefik.http.routers.central-ui.tls=true"
        - "traefik.http.routers.central-ui.tls.certresolver=le"
        - "traefik.http.services.central-ui.loadbalancer.server.port=5173"
        - "traefik.http.middlewares.central-ui-strip.stripprefix.prefixes=/ui"
        - "traefik.http.routers.central-ui.middlewares=central-headers,https-redirect,central-ui-strip"

  db:
    image: postgres:15-alpine
    restart: always
    networks:
      - inove_public
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=84476291
      - POSTGRES_DB=central_celular
    volumes:
      - postgres_data:/var/lib/postgresql/data

networks:
  inove_public:
    external: true
    attachable: true
    name: inove_public

  traefik_public:
    external: true
    name: traefik_public

volumes:
  postgres_data:
    external: false
  central_celular_data:
    external: false 