<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />

    <!-- Viewport com safe-area para iPhone com notch/home-bar -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- PWA / tema -->
    <meta name="theme-color" content="#7928fa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aprisco" />

    <title>Aprisco</title>
    <style>
      /* Splash minimalista (cores alinhadas ao tema: neutral-50 + primary-600 do Tailwind) */
      #app-splash {
        display: none;
        box-sizing: border-box;
      }
      @media (max-width: 767px) {
        html.is-pwa-shell #app-splash {
          display: flex;
          position: fixed;
          inset: 0;
          z-index: 2147483000;
          margin: 0;
          padding: max(1.5rem, env(safe-area-inset-top, 0px)) max(1.25rem, env(safe-area-inset-right, 0px))
            max(1.5rem, env(safe-area-inset-bottom, 0px)) max(1.25rem, env(safe-area-inset-left, 0px));
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 1rem;
          font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
          background: #f9fafb;
          color: #6b7280;
          -webkit-font-smoothing: antialiased;
          transition: opacity 0.35s ease, visibility 0.35s ease;
        }
        html.is-pwa-shell #app-splash.app-splash--out {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
      }
      .app-splash__spinner {
        width: 1.75rem;
        height: 1.75rem;
        border: 2px solid #e5e7eb;
        border-top-color: #7928fa;
        border-radius: 50%;
        flex-shrink: 0;
        animation: app-splash-spin 0.65s linear infinite;
      }
      .app-splash__text {
        margin: 0;
        font-size: 0.875rem;
        font-weight: 500;
        letter-spacing: 0.01em;
        color: #6b7280;
      }
      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash__spinner {
          animation: none;
          border-top-color: #d9d1ff;
          opacity: 0.85;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var narrow = window.matchMedia('(max-width: 767px)').matches
          var installed =
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
            (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches) ||
            (window.matchMedia && window.matchMedia('(display-mode: minimal-ui)').matches) ||
            (typeof navigator !== 'undefined' && navigator.standalone === true)
          if (narrow && installed) document.documentElement.classList.add('is-pwa-shell')
        } catch (e) {}
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800;900&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Splash só em celular + PWA instalado (ver CSS); removido após router.isReady() -->
    <div id="app-splash" role="status" aria-live="polite" aria-busy="true">
      <div class="app-splash__spinner" aria-hidden="true"></div>
      <p class="app-splash__text">Carregando…</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
