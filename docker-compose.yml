# Deploy (VPS): cp .env.example .env → edite → yarn build → docker compose up -d --build
#
# Toda configuração (URLs, senhas, portas) fica no .env — nada sensível neste arquivo.
#
# Front: nginx serve ./dist (rode yarn build antes; VITE_* vem do .env no build).
# Back:  API em app:3000, proxy em /api no nginx.
#
#   yarn build && docker compose up -d --build
#   docker compose up -d --build app      # só backend
#   yarn build && docker compose up -d frontend

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-central_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - central-network

  app:
    build: .
    image: ${DOCKER_IMAGE:-douglagoncalves/central-celular:latest}
    restart: unless-stopped
    ports:
      - "${APP_HOST_PORT:-33000}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-central_db}
      NODE_ENV: ${NODE_ENV:-production}
      HOST: ${HOST:-0.0.0.0}
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      FRONTEND_URL: ${FRONTEND_URL:?Defina FRONTEND_URL no .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    networks:
      - central-network

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8181}:80"
    env_file:
      - .env
    environment:
      QUEPASA_UPSTREAM: ${QUEPASA_UPSTREAM:?Defina QUEPASA_UPSTREAM no .env}
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./docker/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/frontend-entrypoint.sh:/docker-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - central-network

volumes:
  postgres_data:
    name: central-celular_postgres_data

networks:
  central-network:
    driver: bridge
