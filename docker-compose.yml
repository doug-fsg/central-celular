# Deploy na VPS (rede lenta): prefira imagem pronta — sem build no servidor:
#   docker compose pull app && docker compose up -d app
# Build local/CI, push: docker build -t douglagoncalves/central-celular:latest . && docker push ...
#
# Deploy com build na máquina: yarn build && docker compose up -d --build
#
# Após alterar .env: use "docker compose up -d app" (NÃO "restart" — restart não recarrega env).
#
# Compatível com .env "legado" (só DATABASE_URL, JWT_SECRET, VITE_*, FRONTEND_URL)
# ou com POSTGRES_* / portas explícitas — veja .env.example.
#
# O entrypoint do app troca localhost → db em DATABASE_URL.
# O entrypoint do db deriva POSTGRES_* de DATABASE_URL se necessário.

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-central_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db-entrypoint.sh:/docker/db-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/docker/db-entrypoint.sh"]
    command: ["postgres"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - central-network

  app:
    build: .
    image: ${DOCKER_IMAGE:-douglagoncalves/central-celular:latest}
    restart: unless-stopped
    ports:
      - "${APP_HOST_PORT:-33000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: ${HOST:-0.0.0.0}
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    networks:
      - central-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_QUEPASA_USER_EMAIL: ${VITE_QUEPASA_USER_EMAIL:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8181}:80"
    environment:
      QUEPASA_UPSTREAM: ${QUEPASA_UPSTREAM:-http://173.249.22.227:31000}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - central-network

volumes:
  postgres_data:
    name: central-celular_postgres_data

networks:
  central-network:
    driver: bridge
