# Deploy (VPS): git pull && docker compose up -d --build
#   ou: yarn deploy:docker
#
# NÃO basta "yarn build" + "docker compose up -d" (sem --build): o build local
# grava em ./dist na máquina, mas o nginx do container usa o dist gerado DENTRO da imagem.
# Mudou VITE_* no .env → rebuild obrigatório do serviço frontend.
#
# Configuração: copie .env.example para .env e ajuste os valores.

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-central_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - central-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-central_db}
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      FRONTEND_URL: ${FRONTEND_URL:?Defina FRONTEND_URL no .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    networks:
      - central-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:?Defina VITE_API_URL no .env}
        VITE_QUEPASA_USER_EMAIL: ${VITE_QUEPASA_USER_EMAIL:?Defina VITE_QUEPASA_USER_EMAIL no .env}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8181}:80"
    environment:
      QUEPASA_UPSTREAM: ${QUEPASA_UPSTREAM:-http://173.249.22.227:31000}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - central-network

volumes:
  postgres_data:
    name: central-celular_postgres_data

networks:
  central-network:
    driver: bridge
